name: Copy Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  copy-audit:
    name: Wrenchli Copy Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Run copy audit
        run: node scripts/audit-copy.mjs
