name: Copy Audit

# Runs on every branch push and every pull request — banned copy must be
# caught before merge, not after it ships. Hard errors fail the build;
# warnings (pricing claims, sentence length) are review-only and never fail.
on:
  push:
  pull_request:

jobs:
  copy-audit:
    name: Wrenchli Copy Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Run copy audit
        run: node scripts/audit-copy.mjs
